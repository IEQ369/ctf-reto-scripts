[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-author-kit"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["ctf_author*"]

[tool.setuptools.package-data]
ctf_author = ["schemas/*.json"]
